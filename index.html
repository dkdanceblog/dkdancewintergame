<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ДК ДАНС — Хлопья летят наверх</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1430">
  <meta name="description" content="Управляй летающим Федуком и лови хлопья, которые летят наверх. Собери сотку!">
  <meta property="og:title" content="Хлопья летят наверх — игра">
  <meta property="og:description" content="Управляй летающим Федуком и лови хлопья, которые летят наверх. Собери сотку!">
  <meta property="og:image" content="assets/bg.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: radial-gradient(ellipse at center, #0d1a3d 0%, #03060f 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: "Press Start 2P", ui-monospace, monospace;
      color: #fff; user-select: none; -webkit-user-select: none;
    }
    #wrap { position: relative; --u: 1; }
    canvas {
      display: block; border-radius: calc(var(--u) * 10px);
      box-shadow: 0 0 40px rgba(80,140,255,0.25);
      transition: filter .3s ease, transform .33s ease;
      touch-action: none; image-rendering: pixelated;
    }
    canvas.blurred { filter: blur(5px) brightness(.55); transform: scale(1.02); }

    #pauseBtn {
      position: absolute; top: calc(var(--u) * 8px); right: calc(var(--u) * 8px);
      width: calc(var(--u) * 30px); height: calc(var(--u) * 30px);
      border: calc(var(--u) * 2px) solid rgba(255,255,255,.55);
      background: rgba(10,20,50,.55); color: #fff; border-radius: calc(var(--u) * 6px);
      font: inherit; font-size: calc(var(--u) * 10px); cursor: pointer; display: none;
      padding: 0;
    }
    #pauseBtn.show { display: block; }

    .screen {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(3,8,25,.45);
      border-radius: calc(var(--u) * 10px);
    }
    .screen.show { display: flex; animation: fadeUp .35s ease; }
    .card { width: 88%; padding: calc(var(--u) * 14px); }
    h1 {
      font-size: calc(var(--u) * 19px); line-height: 1.45; margin: 0 0 calc(var(--u) * 10px);
      color: #eaf6ff; text-shadow: 0 calc(var(--u)*3px) 0 #2a5cff, 0 0 calc(var(--u)*14px) #6aa8ff;
    }
    h2 { font-size: calc(var(--u) * 16px); margin: 0 0 calc(var(--u) * 12px); line-height: 1.4; }
    p  { font-size: calc(var(--u) * 9px); line-height: 1.8; margin: calc(var(--u) * 6px) 0; opacity: .92; }
    .big { font-size: calc(var(--u) * 12px); }
    .gold { color: #ffd34d; }
    .badge {
      display: inline-block; margin-top: calc(var(--u) * 4px);
      font-size: calc(var(--u) * 8px); color: #1b1300; background: #ffd34d;
      padding: calc(var(--u) * 5px) calc(var(--u) * 7px); border-radius: calc(var(--u) * 4px);
      animation: pulse 1s ease-in-out infinite;
    }
    .legend {
      display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 6px) calc(var(--u) * 8px);
      align-items: center; text-align: left; margin: calc(var(--u) * 12px) auto;
      width: fit-content; font-size: calc(var(--u) * 8px); line-height: 1.5;
      background: rgba(0,0,0,.35); padding: calc(var(--u) * 10px); border-radius: calc(var(--u) * 8px);
    }
    .legend img { width: calc(var(--u) * 20px); height: calc(var(--u) * 20px); image-rendering: pixelated; }
    .btns { display: flex; flex-direction: column; gap: calc(var(--u) * 8px); align-items: center; margin-top: calc(var(--u) * 12px); }
    button.b {
      font: inherit; font-size: calc(var(--u) * 10px); color: #fff; cursor: pointer;
      background: #2a5cff; border: none; border-radius: calc(var(--u) * 6px);
      padding: calc(var(--u) * 11px) calc(var(--u) * 16px); min-width: 70%;
      box-shadow: 0 calc(var(--u) * 4px) 0 #12308f;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    button.b:active { transform: translateY(calc(var(--u) * 3px)); box-shadow: 0 calc(var(--u) * 1px) 0 #12308f; }
    button.b.alt { background: rgba(255,255,255,.12); box-shadow: 0 calc(var(--u) * 4px) 0 rgba(0,0,0,.4); }
    button.b.gold { background: #e9a800; color: #1b1300; box-shadow: 0 calc(var(--u) * 4px) 0 #8a6200; }
    .small { font-size: calc(var(--u) * 7px); opacity: .6; margin-top: calc(var(--u) * 10px); }

    @keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: none; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="pauseBtn" aria-label="Пауза">II</button>

  <!-- МЕНЮ -->
  <div class="screen show" id="menu">
    <div class="card">
      <h1>ХЛОПЬЯ<br>ЛЕТЯТ<br>НАВЕРХ</h1>
      <p>Лови хлопья — собери сотку!</p>
      <div class="legend" id="legend"></div>
      <p id="menuBest" class="gold"></p>
      <div class="btns">
        <button class="b" id="playBtn">ИГРАТЬ</button>
        <button class="b alt" id="muteBtn1">ЗВУК: ВКЛ</button>
      </div>
      <div class="small">← → / мышь / палец</div>
    </div>
  </div>

  <!-- ПАУЗА -->
  <div class="screen" id="pause">
    <div class="card">
      <h2>ПАУЗА</h2>
      <div class="btns">
        <button class="b" id="resumeBtn">ПРОДОЛЖИТЬ</button>
        <button class="b alt" id="muteBtn2">ЗВУК: ВКЛ</button>
        <button class="b alt" id="restartBtn">ЗАНОВО</button>
      </div>
    </div>
  </div>

  <!-- ФИНАЛ -->
  <div class="screen" id="over">
    <div class="card">
      <h2 id="overTitle"></h2>
      <p class="big" id="overScore"></p>
      <p id="overLine"></p>
      <p id="overStats"></p>
      <div id="overRecord"></div>
      <div class="btns">
        <button class="b gold" id="endlessBtn">БЕСКОНЕЧНЫЙ РЕЖИМ</button>
        <button class="b" id="againBtn">ЕЩЁ РАЗ</button>
        <button class="b alt" id="shareBtn">ПОДЕЛИТЬСЯ</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
// =====================================================================
//  БАЗА
// =====================================================================
const W = 360, H = 640;
const WIN_SCORE = 100;
const MAX_LIVES = 5;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const wrap = document.getElementById("wrap");
const $ = id => document.getElementById(id);

const store = {
  get(k, d) { try { const v = localStorage.getItem("dkdance_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("dkdance_" + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- адаптив под любой экран ----------
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingEnabled = false;
  wrap.style.setProperty("--u", (cw / W).toFixed(3));
}
window.addEventListener("resize", resize);
resize();

// =====================================================================
//  СПРАЙТЫ
// =====================================================================
const img = src => { const i = new Image(); i.src = src; return i; };
const bgImg = img("assets/bg.jpg");
const fedukImg = img("assets/feduk.png");
const flakeImg = img("assets/flake.png");
const loaded = i => i.complete && i.naturalWidth > 0;

// пиксельные иконки
const SPR = {
  heart: { px: [
    ".XX.XX.",
    "XWXXXXX",
    "XXXXXXX",
    ".XXXXX.",
    "..XXX..",
    "...X..."], c: { X: "#ff3b5c", W: "#ffd0d8" } },
  heartEmpty: { px: [
    ".XX.XX.",
    "X..X..X",
    "X.....X",
    ".X...X.",
    "..X.X..",
    "...X..."], c: { X: "#5a6a8a" } },
  ice: { px: [
    "...X...",
    "...X...",
    "..XWX..",
    "..XWX..",
    ".XXWXX.",
    ".XXWXX.",
    "XXXWXXX",
    "XXXXXXX",
    ".XXXXX.",
    "..XXX.."], c: { X: "#3d8cff", W: "#d8f2ff" } },
  star: { px: [
    "...X...",
    "..XWX..",
    "XXXWXXX",
    ".XXXXX.",
    "..XXX..",
    ".XX.XX.",
    "X.....X"], c: { X: "#d47bff", W: "#fff" } }
};
function drawSprite(sp, cx, cy, size) {
  const rows = sp.px.length, cols = sp.px[0].length;
  const p = size / Math.max(rows, cols);
  const ox = cx - cols * p / 2, oy = cy - rows * p / 2;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = sp.px[y][x];
    if (ch === ".") continue;
    ctx.fillStyle = sp.c[ch];
    ctx.fillRect(Math.floor(ox + x * p), Math.floor(oy + y * p), Math.ceil(p), Math.ceil(p));
  }
}

// золотая снежинка — перекрашиваем оригинальную
let goldFlake = null;
function makeGoldFlake() {
  const c = document.createElement("canvas");
  c.width = c.height = 200;
  const g = c.getContext("2d");
  g.drawImage(flakeImg, 0, 0, 200, 200);
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = "rgba(255,190,30,0.78)";
  g.fillRect(0, 0, 200, 200);
  goldFlake = c;
}

// иконки для легенды в меню
function buildLegend() {
  const icon = drawFn => {
    const c = document.createElement("canvas"); c.width = c.height = 40;
    const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
    drawFn(g); return c.toDataURL();
  };
  const sprIcon = sp => icon(g => {
    const rows = sp.px.length, cols = sp.px[0].length, p = 36 / Math.max(rows, cols);
    const ox = 20 - cols * p / 2, oy = 20 - rows * p / 2;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const ch = sp.px[y][x]; if (ch === ".") continue;
      g.fillStyle = sp.c[ch]; g.fillRect(Math.floor(ox + x * p), Math.floor(oy + y * p), Math.ceil(p), Math.ceil(p));
    }
  });
  const items = [
    [icon(g => g.drawImage(flakeImg, 0, 0, 40, 40)), "хлопья: +1"],
    [icon(g => g.drawImage(goldFlake, 0, 0, 40, 40)), "золотые: +5"],
    [sprIcon(SPR.heart), "сердце: +жизнь"],
    [sprIcon(SPR.star), "магия: магнит"],
    [sprIcon(SPR.ice), "сосулька: не лови!"]
  ];
  $("legend").innerHTML = items.map(([s, t]) => `<img src="${s}" alt=""><span>${t}</span>`).join("");
}
flakeImg.addEventListener("load", () => { makeGoldFlake(); buildLegend(); });
if (loaded(flakeImg)) { makeGoldFlake(); buildLegend(); }

// =====================================================================
//  ЗВУК
// =====================================================================
const music = new Audio("assets/music.mp3");
music.loop = true;
music.volume = 0.35;
let muted = store.get("muted", false);
let actx = null;

function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq, dur, type = "square", vol = 0.05, slide = 0, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const sfx = {
  catch(combo) { tone(SCALE[Math.min(combo, SCALE.length - 1)], 0.09, "square", 0.035); },
  gold()  { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.12, "square", 0.035, 0, i * 0.05)); },
  heart() { [659, 880, 1319].forEach((f, i) => tone(f, 0.14, "triangle", 0.08, 0, i * 0.07)); },
  star()  { for (let i = 0; i < 6; i++) tone(700 + i * 180, 0.1, "sine", 0.06, 0, i * 0.04); },
  miss()  { tone(220, 0.25, "sawtooth", 0.04, 0.5); },
  hurt()  { tone(160, 0.3, "square", 0.06, 0.4); tone(90, 0.35, "sawtooth", 0.05, 0.5, 0.03); },
  win()   { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.18, "square", 0.045, 0, i * 0.12)); },
  lose()  { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, "triangle", 0.08, 0, i * 0.16)); },
  combo() { tone(1568, 0.08, "square", 0.04); tone(2093, 0.12, "square", 0.04, 0, 0.07); }
};
function applyMute() {
  music.muted = muted;
  const t = muted ? "ЗВУК: ВЫКЛ" : "ЗВУК: ВКЛ";
  $("muteBtn1").textContent = t; $("muteBtn2").textContent = t;
}
function toggleMute() { muted = !muted; store.set("muted", muted); applyMute(); }
applyMute();

// =====================================================================
//  СОСТОЯНИЕ
// =====================================================================
let state = "menu";          // menu | play | paused | over
let score = 0, lives = MAX_LIVES;
let combo = 0, bestCombo = 0, caught = 0;
let endless = false, wonOnce = false;
let best = store.get("best", 0);
let spawnTime = 0, time = 0;
let magnetT = 0, shakeT = 0, hurtT = 0, catchPulse = 0, flashText = null;

const items = [];
const particles = [];
const floaters = [];
const ambient = [];
for (let i = 0; i < 45; i++) ambient.push({ x: Math.random() * W, y: Math.random() * H, s: 1 + Math.random() * 2, v: 12 + Math.random() * 30 });

const player = { x: W / 2 - 35, y: H * 0.18, w: 70, h: 110, speed: 470, vx: 0, tilt: 0 };

function difficulty() { return Math.min(1, score / (endless ? 400 : 140)); }
function multiplier() { return combo >= 25 ? 3 : combo >= 10 ? 2 : 1; }

// =====================================================================
//  СПАВН
// =====================================================================
function spawnItem() {
  const d = difficulty();
  const r = Math.random();
  let type = "flake";
  const iceChance = score < 12 ? 0 : 0.08 + d * 0.12;
  if (r < iceChance) type = "ice";
  else if (r < iceChance + 0.06) type = "gold";
  else if (r < iceChance + 0.085 && lives < MAX_LIVES) type = "heart";
  else if (r < iceChance + 0.105 && score > 15 && magnetT <= 0) type = "star";

  const base = 95 + d * 110;
  const speed = base + Math.random() * (100 + d * 60) + (type === "gold" ? 50 : 0);
  items.push({
    type, speed,
    x: Math.random() * (W - 50) + 25,
    y: H + 24,
    r: type === "flake" ? 12 : 13,
    offset: Math.random() * Math.PI * 2,
    amp: 4 + Math.random() * 3 + (type === "gold" ? 4 : 0),
    wobble: 1 + Math.random() * 1.5,
    spin: (Math.random() - 0.5) * 2,
    rot: Math.random() * Math.PI
  });
}

// =====================================================================
//  ЭФФЕКТЫ
// =====================================================================
function burst(x, y, color, n = 10, spd = 140) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.4, t: 0, c: color, s: 2 + Math.floor(Math.random() * 3) });
  }
}
function floatText(x, y, text, color = "#fff", size = 10) {
  floaters.push({ x, y, text, color, size, t: 0, life: 0.9 });
}

// =====================================================================
//  ЛОГИКА
// =====================================================================
function catchItem(it) {
  const cx = it.x, cy = it.y;
  if (it.type === "ice") {
    lives--; combo = 0; shakeT = 0.35; hurtT = 0.4;
    burst(cx, cy, "#7fc4ff", 14, 180);
    floatText(cx, cy, "АЙ!", "#ff6b81", 12);
    sfx.hurt();
    if (navigator.vibrate) navigator.vibrate(80);
    if (lives <= 0) return endGame(false);
    return;
  }
  if (it.type === "heart") {
    lives = Math.min(MAX_LIVES, lives + 1);
    burst(cx, cy, "#ff3b5c", 12);
    floatText(cx, cy, "+♥", "#ff6b81", 12);
    sfx.heart();
    return;
  }
  if (it.type === "star") {
    magnetT = 6;
    burst(cx, cy, "#d47bff", 18, 200);
    flashText = { text: "МАГИЯ!", t: 0 };
    sfx.star();
    return;
  }
  combo++; caught++;
  bestCombo = Math.max(bestCombo, combo);
  if (combo === 10 || combo === 25) { flashText = { text: "КОМБО x" + multiplier(), t: 0 }; sfx.combo(); }
  const m = multiplier();
  const pts = (it.type === "gold" ? 5 : 1) * m;
  score += pts;
  catchPulse = 1;
  if (it.type === "gold") { burst(cx, cy, "#ffd34d", 16, 180); sfx.gold(); floatText(cx, cy, "+" + pts, "#ffd34d", 12); }
  else { burst(cx, cy, "#dff3ff", 8); sfx.catch(combo); floatText(cx, cy, "+" + pts, m > 1 ? "#9fe7ff" : "#fff", m > 1 ? 11 : 9); }

  if (!endless && score >= WIN_SCORE) endGame(true);
}

function missItem(it) {
  if (it.type !== "flake" && it.type !== "gold") return;
  lives--; combo = 0; hurtT = 0.3; shakeT = 0.2;
  floatText(it.x, 40, "мимо", "#ff6b81", 9);
  sfx.miss();
  if (lives <= 0) endGame(false);
}

function update(dt) {
  time += dt;
  // фоновые хлопья летят наверх всегда
  for (const a of ambient) {
    a.y -= a.v * dt;
    if (a.y < -4) { a.y = H + 4; a.x = Math.random() * W; }
  }
  updateFx(dt);
  if (state !== "play") return;

  // управление
  const prevX = player.x;
  if (keys.left) player.x -= player.speed * dt;
  if (keys.right) player.x += player.speed * dt;
  if (pointer.active && pointer.x !== null) {
    const target = pointer.x - player.w / 2;
    player.x += (target - player.x) * Math.min(1, dt * 12);
  }
  player.x = Math.max(0, Math.min(W - player.w, player.x));
  player.vx = dt > 0 ? (player.x - prevX) / dt : 0;
  player.tilt += (Math.max(-0.22, Math.min(0.22, player.vx / 1800)) - player.tilt) * Math.min(1, dt * 10);

  // спавн
  const d = difficulty();
  const interval = 1.0 - d * 0.55;
  const maxItems = 14 + Math.round(d * 10);
  spawnTime += dt;
  if (spawnTime >= interval) {
    spawnTime = 0;
    if (items.length < maxItems) spawnItem();
  }

  if (magnetT > 0) magnetT -= dt;
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;

  for (let i = items.length - 1; i >= 0; i--) {
    const f = items[i];
    f.offset += f.wobble * dt;
    f.x += Math.sin(f.offset) * f.amp * dt * 8;
    f.y -= f.speed * dt;
    f.rot += f.spin * dt;

    // магнит тянет хорошие хлопья
    if (magnetT > 0 && (f.type === "flake" || f.type === "gold")) {
      const dx = pcx - f.x, dy = pcy - f.y, dist = Math.hypot(dx, dy);
      if (dist < 190) { f.x += dx * dt * 5; f.y += dy * dt * 3; }
    }
    f.x = Math.max(f.r, Math.min(W - f.r, f.x));

    const hitX = Math.abs(f.x - pcx) < player.w * 0.45 + f.r * 0.5;
    const hitY = f.y < player.y + player.h - 6 && f.y > player.y + 4;
    if (hitX && hitY) {
      items.splice(i, 1);
      catchItem(f);
      if (state !== "play") return;
      continue;
    }
    if (f.y + f.r < -20) {
      items.splice(i, 1);
      missItem(f);
      if (state !== "play") return;
    }
  }
}

function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 60 * dt; p.vx *= 0.98;
    if (p.t > p.life) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dt; f.y -= 40 * dt;
    if (f.t > f.life) floaters.splice(i, 1);
  }
  if (flashText) { flashText.t += dt; if (flashText.t > 1.2) flashText = null; }
  shakeT = Math.max(0, shakeT - dt);
  hurtT = Math.max(0, hurtT - dt);
  catchPulse = Math.max(0, catchPulse - dt * 6);
}

// =====================================================================
//  ОТРИСОВКА
// =====================================================================
function drawBG() {
  if (loaded(bgImg)) ctx.drawImage(bgImg, 0, 0, W, H);
  else { ctx.fillStyle = "#0a1430"; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = "rgba(220,235,255,0.55)";
  for (const a of ambient) ctx.fillRect(Math.floor(a.x), Math.floor(a.y), a.s, a.s);
}

function drawItems() {
  for (const f of items) {
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.type === "flake" || f.type === "gold") {
      ctx.rotate(f.rot);
      const src = f.type === "gold" && goldFlake ? goldFlake : flakeImg;
      if (f.type === "gold") { ctx.shadowColor = "#ffcf3a"; ctx.shadowBlur = 12; }
      if (loaded(flakeImg)) ctx.drawImage(src, -f.r, -f.r, f.r * 2, f.r * 2);
      else { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.fill(); }
    } else {
      const s = 1 + Math.sin(time * 6 + f.offset) * 0.08;
      ctx.scale(s, s);
      if (f.type === "ice") { ctx.shadowColor = "#ff2d55"; ctx.shadowBlur = 10 + Math.sin(time * 10) * 4; }
      if (f.type === "star") { ctx.shadowColor = "#d47bff"; ctx.shadowBlur = 14; }
      if (f.type === "heart") { ctx.shadowColor = "#ff3b5c"; ctx.shadowBlur = 10; }
      drawSprite(SPR[f.type], 0, 0, f.type === "ice" ? 30 : 26);
    }
    ctx.restore();
  }
}

function drawPlayer() {
  const bobY = Math.sin(time * 2.4) * 2.5;
  const bobX = Math.sin(time * 1.7) * 1.2;
  const cx = player.x + player.w / 2 + bobX;
  const cy = player.y + player.h / 2 + bobY;
  const s = 1 + catchPulse * 0.07;

  // аура магии
  if (magnetT > 0) {
    const a = Math.min(1, magnetT) * (0.35 + Math.sin(time * 8) * 0.1);
    ctx.strokeStyle = `rgba(212,123,255,${a})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 70 + Math.sin(time * 5) * 6, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(player.tilt);
  ctx.scale(s, s);
  if (hurtT > 0 && Math.floor(hurtT * 20) % 2 === 0) ctx.globalAlpha = 0.45;
  if (loaded(fedukImg)) ctx.drawImage(fedukImg, -player.w / 2, -player.h / 2, player.w, player.h);
  else { ctx.fillStyle = "#f55"; ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h); }
  ctx.restore();
}

function drawFx() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
    pixelText(f.text, f.x, f.y, f.size, f.color);
  }
  ctx.globalAlpha = 1;
}

function pixelText(text, x, y, size, color, align) {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  if (align) ctx.textAlign = align;
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillText(text, x + 1, y + 2);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawHUD() {
  // жизни
  for (let i = 0; i < MAX_LIVES; i++) drawSprite(i < lives ? SPR.heart : SPR.heartEmpty, 20 + i * 22, 22, 18);
  // счёт
  ctx.textBaseline = "middle";
  pixelText(String(score), W - 50, 23, 14, "#fff", "right");
  // прогресс до сотки / бесконечный режим
  const y = 42;
  if (!endless) {
    const p = Math.min(1, score / WIN_SCORE);
    ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(10, y, W - 20, 8);
    ctx.fillStyle = "#1c3b8f"; ctx.fillRect(11, y + 1, W - 22, 6);
    const grad = ctx.createLinearGradient(10, 0, W - 10, 0);
    grad.addColorStop(0, "#6ad1ff"); grad.addColorStop(1, "#ffffff");
    ctx.fillStyle = grad; ctx.fillRect(11, y + 1, Math.floor((W - 22) * p), 6);
    pixelText(`${Math.min(score, WIN_SCORE)}/${WIN_SCORE}`, W / 2, y + 18, 7, "rgba(255,255,255,0.75)", "center");
  } else {
    pixelText("БЕСКОНЕЧНОСТЬ  рекорд " + Math.max(best, score), W / 2, y + 6, 7, "#ffd34d", "center");
  }
  // комбо
  if (combo >= 3) {
    const m = multiplier();
    pixelText(`комбо ${combo}` + (m > 1 ? `  x${m}` : ""), W / 2, H - 22, 9, m > 1 ? "#9fe7ff" : "rgba(255,255,255,0.8)", "center");
  }
  // магия
  if (magnetT > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(W / 2 - 50, H - 44, 100, 6);
    ctx.fillStyle = "#d47bff"; ctx.fillRect(W / 2 - 50, H - 44, 100 * (magnetT / 6), 6);
  }
  // большая надпись
  if (flashText) {
    const k = flashText.t;
    ctx.globalAlpha = k < 0.9 ? 1 : Math.max(0, 1 - (k - 0.9) / 0.3);
    pixelText(flashText.text, W / 2, H * 0.5, 18 + Math.max(0, 0.15 - k) * 60, "#fff", "center");
    ctx.globalAlpha = 1;
  }
  ctx.textBaseline = "alphabetic";
}

function drawHurt() {
  if (hurtT <= 0) return;
  const a = hurtT * 0.9;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, "rgba(255,0,40,0)");
  g.addColorStop(1, `rgba(255,0,40,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render() {
  ctx.save();
  if (shakeT > 0) {
    const m = shakeT * 18;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }
  drawBG();
  drawItems();
  if (state !== "menu") drawPlayer();
  drawFx();
  ctx.restore();
  drawHurt();
  if (state === "play" || state === "paused") drawHUD();
}

// =====================================================================
//  ЭКРАНЫ
// =====================================================================
function showScreen(id) {
  for (const s of ["menu", "pause", "over"]) $(s).classList.toggle("show", s === id);
  canvas.classList.toggle("blurred", !!id && id !== "menu");
  $("pauseBtn").classList.toggle("show", state === "play");
}

function updateMenuBest() { $("menuBest").textContent = best > 0 ? "Рекорд: " + best : ""; }

function startGame(keepEndless = false) {
  ensureAudio();
  if (music.paused) music.play().catch(() => {});
  if (!keepEndless) {
    score = 0; lives = MAX_LIVES; combo = 0; bestCombo = 0; caught = 0;
    endless = false; wonOnce = false;
    items.length = 0;
  }
  particles.length = 0; floaters.length = 0;
  magnetT = 0; spawnTime = 0; flashText = null;
  player.x = W / 2 - player.w / 2;
  state = "play";
  showScreen(null);
  if (!keepEndless) flashText = { text: "ПОЕХАЛИ!", t: 0 };
}

function endGame(win) {
  state = "over";
  const isRecord = score > best;
  if (isRecord) { best = score; store.set("best", best); }

  if (win) {
    wonOnce = true;
    $("overTitle").textContent = "ПОБЕДА!";
    $("overLine").textContent = "Всюду магия и свет ✨";
    sfx.win();
    for (let i = 0; i < 80; i++) burst(Math.random() * W, H * 0.3 + Math.random() * H * 0.5, Math.random() < 0.3 ? "#ffd34d" : "#dff3ff", 1, 220);
  } else {
    $("overTitle").textContent = endless ? "ВОТ ЭТО ЗАБЕГ!" : "ИГРА ОКОНЧЕНА";
    $("overLine").textContent = "Падают хлопья, и с ними ты ❄️";
    sfx.lose();
  }
  $("overScore").textContent = `Очки: ${score}`;
  $("overStats").textContent = `Поймано: ${caught} · Лучшее комбо: ${bestCombo}`;
  $("overRecord").innerHTML = isRecord && score > 0 ? '<span class="badge">НОВЫЙ РЕКОРД!</span>' : `<p class="gold">Рекорд: ${best}</p>`;
  $("endlessBtn").style.display = win ? "" : "none";
  $("againBtn").textContent = win ? "СНАЧАЛА" : "ЕЩЁ РАЗ";
  $("shareBtn").textContent = "ПОДЕЛИТЬСЯ";
  setTimeout(() => showScreen("over"), win ? 600 : 300);
}

function pauseGame() {
  if (state !== "play") return;
  state = "paused";
  music.pause();
  showScreen("pause");
}
function resumeGame() {
  if (state !== "paused") return;
  state = "play";
  music.play().catch(() => {});
  showScreen(null);
}

async function share() {
  const text = `Я набрал ${score} очков в игре «Хлопья летят наверх» ❄️ Попробуй побить!`;
  const url = location.href.split("#")[0];
  try {
    if (navigator.share) { await navigator.share({ title: "Хлопья летят наверх", text, url }); return; }
    await navigator.clipboard.writeText(text + " " + url);
    $("shareBtn").textContent = "СКОПИРОВАНО!";
  } catch (e) {}
}

// кнопки
const tap = (id, fn) => $(id).addEventListener("click", e => { e.stopPropagation(); fn(); });
tap("playBtn", () => startGame());
tap("againBtn", () => startGame());
tap("restartBtn", () => startGame());
tap("resumeBtn", resumeGame);
tap("pauseBtn", pauseGame);
tap("muteBtn1", () => { ensureAudio(); toggleMute(); });
tap("muteBtn2", toggleMute);
tap("shareBtn", share);
tap("endlessBtn", () => { endless = true; startGame(true); flashText = { text: "БЕСКОНЕЧНОСТЬ!", t: 0 }; });

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (state === "play") pauseGame(); else music.pause(); }
  else if (state === "menu" || state === "over") { if (actx) music.play().catch(() => {}); }
});

// =====================================================================
//  УПРАВЛЕНИЕ
// =====================================================================
const keys = { left: false, right: false };
window.addEventListener("keydown", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (e.code === "Escape" || e.code === "KeyP") { state === "play" ? pauseGame() : resumeGame(); }
  if (e.code === "Space" || e.code === "Enter") {
    e.preventDefault();
    if (state === "menu") startGame();
    else if (state === "paused") resumeGame();
    else if (state === "over" && $("over").classList.contains("show")) startGame();
  }
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

const pointer = { active: false, x: null };
function pMove(e) {
  if (!pointer.active && e.pointerType !== "mouse") return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - rect.left) / rect.width * W;
}
canvas.addEventListener("pointerdown", e => { pointer.active = true; pMove(e); });
window.addEventListener("pointermove", e => {
  // мышью — достаточно водить, без нажатия
  if (e.pointerType === "mouse" && state === "play") pointer.active = true;
  pMove(e);
});
window.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") { pointer.active = false; pointer.x = null; } });
window.addEventListener("keydown", () => { pointer.active = false; pointer.x = null; });

// =====================================================================
//  ЦИКЛ
// =====================================================================
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); // защита от рывков после сворачивания
  last = ts;
  if (state !== "paused") update(dt);
  render();
  requestAnimationFrame(loop);
}
updateMenuBest();
requestAnimationFrame(loop);
// перерисовать текст на канвасе, когда шрифт догрузится
if (document.fonts) document.fonts.load('10px "Press Start 2P"');
</script>
</body>
</html>
