  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = cw + "px";

  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingEnabled = false;
  wrap.style.setProperty("--u", (cw / W).toFixed(3));
}
window.addEventListener("resize", resize);

    "X.....X"], c: { X: "#d47bff", W: "#fff" } }
};
function drawSprite(sp, cx, cy, size, g = ctx) {
  const rows = sp.px.length, cols = sp.px[0].length;
  const p = size / Math.max(rows, cols);
  const ox = cx - cols * p / 2, oy = cy - rows * p / 2;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = sp.px[y][x];
    if (ch === ".") continue;
    g.fillStyle = sp.c[ch];
    g.fillRect(Math.floor(ox + x * p), Math.floor(oy + y * p), Math.ceil(p), Math.ceil(p));
  }
}

let goldFlake = null;
function makeGoldFlake() {
  const c = document.createElement("canvas");
  c.width = c.height = 200;
  const g = c.getContext("2d");
  g.drawImage(flakeImg, 0, 0, 200, 200);
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = "rgba(255,190,30,0.78)";
  g.fillRect(0, 0, 200, 200);
  goldFlake = c;
}
function buildLegend() {
  const icon = fn => { const c = document.createElement("canvas"); c.width = c.height = 40; const g = c.getContext("2d"); g.imageSmoothingEnabled = false; fn(g); return c.toDataURL(); };
  const items = [
    [icon(g => g.drawImage(flakeImg, 0, 0, 40, 40)), "хлопья = ноты песни"],

  ];
  $("legend").innerHTML = items.map(([s, t]) => `<img src="${s}" alt=""><span>${t}</span>`).join("");
}
function onFlake() { makeGoldFlake(); buildLegend(); }
flakeImg.addEventListener("load", onFlake);
if (loaded(flakeImg)) onFlake();

// =====================================================================
//  ЗВУК — всё через WebAudio, чтобы часы игры = часы песни
// =====================================================================
const AC = window.AudioContext || window.webkitAudioContext;
const actx = new AC();
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {} // iPhone: играть даже в беззвучном режиме
const master = actx.createGain(); master.connect(actx.destination);
const musicGain = actx.createGain(); musicGain.gain.value = 0.55; musicGain.connect(master);
const sfxGain = actx.createGain(); sfxGain.gain.value = 1; sfxGain.connect(master);

let muted = store.get("muted", false);
let songBuf = null, songSrc = null, songStart = 0;
let SONG_LEN = 167.3;

function loadMode(m, btnId, label) {
  fetch(m.file)
    .then(r => r.arrayBuffer())
    .then(ab => new Promise((res, rej) => actx.decodeAudioData(ab, res, rej)))
    .then(buf => { m.buf = buf; })
    .catch(() => {})            // без музыки всё равно можно играть
    .then(() => { const b = $(btnId); b.disabled = false; b.textContent = label; });
}
loadMode(MODES.piano, "playBtn", "ИГРАТЬ: ПИАНИНО");
loadMode(MODES.orig, "playOrigBtn", "ИГРАТЬ: ОРИГИНАЛ");

function setMode(m) {
  mode = m;
  BPM = m.bpm; BEAT = 60 / BPM; EIGHTH = BEAT / 2; GRID_OFFSET = m.offset;
  songBuf = m.buf || null;
  SONG_LEN = songBuf ? songBuf.duration : (m.t[m.t.length - 1] + 2);
  musicGain.gain.value = m.musicVol;
}

function startSong() {
  if (songSrc) { try { songSrc.stop(); } catch (e) {} songSrc = null; }
  stopVoices();
  songStart = actx.currentTime + 0.15;
  if (!songBuf) return;
  songSrc = actx.createBufferSource();
  songSrc.buffer = songBuf;
  songSrc.loop = true;
  songSrc.connect(musicGain);
  songSrc.start(songStart);
}
const songNow = () => actx.currentTime - songStart;   // секунды от начала песни (не обнуляются на повторе)

function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

const voices = [];
function track(node, t) { voices.push({ node, t }); if (voices.length > 400) voices.splice(0, voices.length - 300); }
function stopVoices() {
  for (const v of voices) { try { v.node.stop(); } catch (e) {} }
  voices.length = 0;
}

// пианино: те же обертоны и затухание, что у отрендеренного минуса
function pianoNote(midi, when = 0, dur = 0.4, vel = 0.5) {
  const t = Math.max(actx.currentTime, when);
  const f = midiHz(midi);
  const amp = 0.22 * (0.5 + vel) * 0.75;
  const lowk = 1 + Math.max(0, midi - 48) * 0.06;
  const end = t + Math.min(dur, 4) + 0.2;
  const out = actx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.linearRampToValueAtTime(amp, t + 0.004);
  out.gain.setValueAtTime(amp, t + Math.min(dur, 4));
  out.gain.exponentialRampToValueAtTime(0.0001, end);
  out.connect(sfxGain);
  for (let k = 1; k <= 5; k++) {
    const fk = f * k * Math.sqrt(1 + 0.0004 * k * k);
    if (fk > 18000) break;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = fk;
    const a = (1 / Math.pow(k, 1.4)) * (k === 1 ? 1 : 0.8);
    const rate = lowk * (1.2 + 0.9 * k);
    g.gain.setValueAtTime(a, t);
    g.gain.setTargetAtTime(0.0001, t, 1 / rate);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(end + 0.05);
    track(o, t);
  }
}
function playMelodyNote(i, when, extra = 0) {
  if (mode.voice === "piano") pianoNote(mode.p[i] + extra, when, mode.d[i], mode.v[i]);
  else bell(mode.p[i] + extra, when);
}

// музыкальная шкатулка
function bell(midi, when = 0, vol = 0.22) {
  const t = Math.max(actx.currentTime, when);
  const f = midiHz(midi);
  const out = actx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  out.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  out.connect(sfxGain);
  [[1, 1, "sine"], [2, 0.35, "sine"], [3.01, 0.12, "triangle"]].forEach(([mul, amp, type]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f * mul;
    g.gain.setValueAtTime(amp, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9 / mul);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 1);
  });
}
function tone(freq, dur, type = "square", vol = 0.05, slide = 0, delay = 0) {
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  heart() { [76, 81, 88].forEach((m, i) => bell(m, actx.currentTime + i * 0.07, 0.18)); },
  star()  { [81, 85, 88, 93].forEach((m, i) => bell(m, actx.currentTime + i * 0.05, 0.15)); },
  miss()  { tone(140, 0.18, "triangle", 0.12, 0.6); },
  hurt()  { tone(160, 0.3, "square", 0.06, 0.4); tone(90, 0.35, "sawtooth", 0.05, 0.5, 0.03); },
  win()   { [69, 73, 76, 81, 85, 88].forEach((m, i) => bell(m, actx.currentTime + i * EIGHTH, 0.2)); },
  lose()  { [76, 73, 69, 64].forEach((m, i) => bell(m, actx.currentTime + i * BEAT * 0.5, 0.2)); }
};
function applyMute() {
  master.gain.value = muted ? 0 : 1;
  const t = muted ? "ЗВУК: ВЫКЛ" : "ЗВУК: ВКЛ";
  $("muteBtn1").textContent = t; $("muteBtn2").textContent = t;
}
function toggleMute() { muted = !muted; store.set("muted", muted); applyMute(); }
applyMute();

// =====================================================================
//  СОСТОЯНИЕ
// =====================================================================
let state = "menu";          // menu | play | paused | over
let score = 0, hp = MAX_HP;
let combo = 0, bestCombo = 0, caught = 0, missed = 0;
let endless = false;
let best = store.get("best", 0);
let time = 0;
let magnetT = 0, shakeT = 0, hurtT = 0, catchPulse = 0, flashText = null;
let chartIdx = 0, chartCycle = 0, lastSpawnNote = -99, specialT = 4;

const items = [];
const particles = [];
const floaters = [];
const ambient = [];
for (let i = 0; i < 45; i++) ambient.push({ x: Math.random() * W, y: Math.random() * H, s: 1 + Math.random() * 2, v: 12 + Math.random() * 30 });

const player = { x: W / 2 - 35, y: H * 0.18, w: 70, h: 110, speed: 520, vx: 0, tilt: 0 };
const CATCH_Y = player.y + player.h * 0.45;
const HIT_WINDOW = 0.11;      // секунд до/после ноты

function difficulty() { return Math.min(1, score / (endless ? 400 : 120)); }
function multiplier() { return combo >= 15 ? 2 : 1; }
function leadTime() { return 2.1 - difficulty() * 0.6; }      // сколько летит хлопья
function minGap() {                                             // плотность нот
  const d = difficulty();
  return d < 0.25 ? BEAT * 2 : d < 0.6 ? BEAT : d < 0.9 ? BEAT * 0.75 : EIGHTH;
}

// нота → место на экране: выше нота — правее. Мелодию видно глазами.
function noteX(midi, absT) {
  const section = Math.floor(absT / (BEAT * 32));               // каждые 8 тактов сдвиг
  const shift = Math.sin(section * 2.3) * 55;
  const x = W / 2 + (midi - 71) * 24 + shift;
  return Math.max(28, Math.min(W - 28, x));
}

// =====================================================================
//  СПАВН
// =====================================================================
function spawnChartNotes() {
  const now = songNow();
  const lead = leadTime();
  for (let guard = 0; guard < 50; guard++) {
    const absT = chartCycle * SONG_LEN + mode.t[chartIdx];
    if (absT - now > lead) break;
    const midi = mode.p[chartIdx];
    const beatPos = (mode.t[chartIdx] - GRID_OFFSET) / BEAT;
    const onBar = Math.abs(beatPos - Math.round(beatPos)) < 0.12 && Math.round(beatPos) % 16 === 0;
    if (state === "play" && absT > now + 0.3 && absT - lastSpawnNote >= minGap() - 0.01) {
      lastSpawnNote = absT;
      const gold = onBar;                  // первая доля каждой 4-тактовой фразы
      items.push({
        type: gold ? "gold" : "flake", chart: true, midi, t: absT, lead,
        x: noteX(midi, absT), baseX: 0, y: H + 30, r: 12,
        rot: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 2,
        sway: Math.random() * Math.PI * 2, done: false, idx: chartIdx
      });
      items[items.length - 1].baseX = items[items.length - 1].x;
    }
    else if (mode.autoplay && absT > now - 0.05) {
      playMelodyNote(chartIdx, songStart + absT);   // эту ноту игра сыграет сама
    }
    chartIdx++;
    if (chartIdx >= mode.t.length) { chartIdx = 0; chartCycle++; }
  }
}

function spawnSpecial() {
  const opts = [];
  if (score >= 12) opts.push("ice", "ice");
  if (hp < MAX_HP) opts.push("heart");
  if (score > 15 && magnetT <= 0) opts.push("star");
  if (!opts.length) return;
  const type = opts[Math.floor(Math.random() * opts.length)];
  items.push({
    type, chart: false,
    x: Math.random() * (W - 60) + 30, y: H + 24, r: 13,
    speed: 150 + Math.random() * 80 + difficulty() * 80,
    offset: Math.random() * Math.PI * 2, amp: 4 + Math.random() * 3, wobble: 1 + Math.random()
  });
}

// =====================================================================
//  ЭФФЕКТЫ
// =====================================================================
function burst(x, y, color, n = 10, spd = 140) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.4, t: 0, c: color, s: 2 + Math.floor(Math.random() * 3) });
  }
}
function floatText(x, y, text, color = "#fff", size = 10) { floaters.push({ x, y, text, color, size, t: 0, life: 0.9 }); }

// =====================================================================
//  ЛОГИКА
// =====================================================================
function damage(n) {
  hp -= n; combo = 0; hurtT = 0.3 + n * 0.1; shakeT = 0.1 + n * 0.1;
  if (hp <= 0) endGame(false);
}

function catchChart(f) {
  f.done = true;
  combo++; caught++;
  bestCombo = Math.max(bestCombo, combo);
  if (combo === 15 || combo === 50) flashText = { text: "КОМБО " + combo + "!", t: 0 };
  const m = multiplier();
  const pts = f.type === "gold" ? 3 : 1;
  score += pts;
  catchPulse = 1;
  // нота мелодии ровно в свою долю
  const when = songStart + f.t;
  playMelodyNote(f.idx, when);
  if (f.type === "gold") { bell(f.midi + 12, when, 0.07); bell(f.midi + 19, when, 0.05); }
  burst(f.x, f.y, f.type === "gold" ? "#ffd34d" : "#dff3ff", f.type === "gold" ? 16 : 8);
  floatText(f.x, f.y - 6, "+" + pts, f.type === "gold" ? "#ffd34d" : m > 1 ? "#9fe7ff" : "#fff", f.type === "gold" ? 12 : 9);
  if (!endless && score >= WIN_SCORE) endGame(true);
}

function catchSpecial(it) {
  if (it.type === "ice") {
    burst(it.x, it.y, "#7fc4ff", 14, 180);
    floatText(it.x, it.y, "АЙ!", "#ff6b81", 12);
    sfx.hurt();
    if (navigator.vibrate) navigator.vibrate(80);
    damage(2);
  } else if (it.type === "heart") {
    hp = Math.min(MAX_HP, hp + 2);
    burst(it.x, it.y, "#ff3b5c", 12);
    floatText(it.x, it.y, "+♥", "#ff6b81", 12);
    sfx.heart();
  } else if (it.type === "star") {
    magnetT = 6;
    burst(it.x, it.y, "#d47bff", 18, 200);
    flashText = { text: "МАГИЯ!", t: 0 };
    sfx.star();
  }
}

function update(dt) {
  time += dt;
  for (const a of ambient) {
    a.y -= a.v * dt;
    if (a.y < -4) { a.y = H + 4; a.x = Math.random() * W; }
  }
  updateFx(dt);
  if (state === "over" && songSrc) spawnChartNotes();   // после игры мелодия доигрывается сама
  if (state !== "play") return;

  // управление
  const prevX = player.x;
  if (keys.left) player.x -= player.speed * dt;
  if (keys.right) player.x += player.speed * dt;
  if (pointer.active && pointer.x !== null) {
    const target = pointer.x - player.w / 2;
    player.x += (target - player.x) * Math.min(1, dt * 14);
  }
  player.x = Math.max(0, Math.min(W - player.w, player.x));
  player.vx = dt > 0 ? (player.x - prevX) / dt : 0;
  player.tilt += (Math.max(-0.22, Math.min(0.22, player.vx / 1800)) - player.tilt) * Math.min(1, dt * 10);

  spawnChartNotes();
  specialT -= dt;
  if (specialT <= 0) { specialT = 3 + Math.random() * 3.5; spawnSpecial(); }
  if (magnetT > 0) magnetT -= dt;

  const now = songNow();
  const pcx = player.x + player.w / 2;

  for (let i = items.length - 1; i >= 0; i--) {
    const f = items[i];

    if (f.chart) {
      // позиция считается от часов песни — хлопья всегда прилетают в долю
      const left = f.t - now;
      f.y = CATCH_Y + (H + 30 - CATCH_Y) * (left / f.lead);
      f.rot += f.spin * dt;
      if (magnetT > 0 && !f.done && left < 1.2) f.baseX += (pcx - f.baseX) * Math.min(1, dt * 6);
      f.x = f.baseX + Math.sin(time * 3 + f.sway) * 6 * Math.max(0, Math.min(1, left / f.lead));

      if (!f.done && Math.abs(left) <= HIT_WINDOW && Math.abs(f.x - pcx) < player.w * 0.5 + 6) {
        items.splice(i, 1);
        catchChart(f);
        if (state !== "play") return;
        continue;
      }
      if (!f.done && left < -HIT_WINDOW) {
        f.done = true; f.missed = true;
        missed++;
        floatText(f.x, CATCH_Y - 30, "мимо", "#ff6b81", 8);
        if (mode.voice !== "piano") sfx.miss();
        damage(1);
        if (state !== "play") return;
      }
      if (f.y < -30) items.splice(i, 1);
      continue;
    }

    // особые предметы летят сами по себе
    f.offset += f.wobble * dt;
    f.x += Math.sin(f.offset) * f.amp * dt * 8;
    f.y -= f.speed * dt;
    f.x = Math.max(f.r, Math.min(W - f.r, f.x));
    const hitX = Math.abs(f.x - pcx) < player.w * 0.42 + f.r * 0.4;
    const hitY = f.y < player.y + player.h - 10 && f.y > player.y + 8;
    if (hitX && hitY) {
      items.splice(i, 1);
      catchSpecial(f);
      if (state !== "play") return;
      continue;
    }
    if (f.y < -30) items.splice(i, 1);
  }
}

function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 60 * dt; p.vx *= 0.98;
    if (p.t > p.life) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dt; f.y -= 40 * dt;
    if (f.t > f.life) floaters.splice(i, 1);
  }
  if (flashText) { flashText.t += dt; if (flashText.t > 1.2) flashText = null; }
  shakeT = Math.max(0, shakeT - dt);
  hurtT = Math.max(0, hurtT - dt);
  catchPulse = Math.max(0, catchPulse - dt * 6);
}

// =====================================================================
//  ОТРИСОВКА
// =====================================================================
function beatPulse() {
  if (state === "menu" || !songSrc) return 0;
  const b = (songNow() - GRID_OFFSET) / BEAT;
  if (b < 0) return 0;
  return Math.exp(-(b - Math.floor(b)) * 7);
}

function drawBG(pulse) {
  if (loaded(bgImg)) ctx.drawImage(bgImg, 0, 0, W, H);
  else { ctx.fillStyle = "#0a1430"; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = `rgba(220,235,255,${0.45 + pulse * 0.4})`;
  for (const a of ambient) ctx.fillRect(Math.floor(a.x), Math.floor(a.y), a.s, a.s);
  if (pulse > 0) { ctx.fillStyle = `rgba(120,170,255,${pulse * 0.05})`; ctx.fillRect(0, 0, W, H); }
}

function drawTargets() {
  // подсказки на линии ловли: куда прилетит следующая нота
  if (state !== "play") return;
  const now = songNow();
  for (const f of items) {
    if (!f.chart || f.done) continue;
    const left = f.t - now;
    if (left > 0.9 || left < 0) continue;
    const k = left / 0.9;
    ctx.strokeStyle = f.type === "gold" ? `rgba(255,211,77,${0.7 - k * 0.6})` : `rgba(200,230,255,${0.6 - k * 0.5})`;
    ctx.lineWidth = 2;
    const r = 8 + k * 22;
    ctx.strokeRect(Math.floor(f.x - r), Math.floor(CATCH_Y - r), Math.floor(r * 2), Math.floor(r * 2));
  }
}

function drawItems() {
  for (const f of items) {
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.chart) {
      if (f.missed) ctx.globalAlpha = 0.35;
      ctx.rotate(f.rot);
      const src = f.type === "gold" && goldFlake ? goldFlake : flakeImg;
      if (f.type === "gold") { ctx.shadowColor = "#ffcf3a"; ctx.shadowBlur = 12; }
      if (loaded(flakeImg)) ctx.drawImage(src, -f.r, -f.r, f.r * 2, f.r * 2);
      else { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.fill(); }
    } else {
      const s = 1 + Math.sin(time * 6 + f.offset) * 0.08;
      ctx.scale(s, s);
      if (f.type === "ice") { ctx.shadowColor = "#ff2d55"; ctx.shadowBlur = 10 + Math.sin(time * 10) * 4; }
      if (f.type === "star") { ctx.shadowColor = "#d47bff"; ctx.shadowBlur = 14; }
      if (f.type === "heart") { ctx.shadowColor = "#ff3b5c"; ctx.shadowBlur = 10; }
      drawSprite(SPR[f.type], 0, 0, f.type === "ice" ? 30 : 26);
    }
    ctx.restore();
  }
}

function drawPlayer(pulse) {
  // Федук качается в такт
  const beats = songSrc ? (songNow() - GRID_OFFSET) / BEAT : time * 2.3;
  const bobY = Math.sin(beats * Math.PI) * 3;
  const bobX = Math.sin(time * 1.7) * 1.2;
  const cx = player.x + player.w / 2 + bobX;
  const cy = player.y + player.h / 2 + bobY;
  const s = 1 + catchPulse * 0.07 + pulse * 0.02;

  if (magnetT > 0) {
    const a = Math.min(1, magnetT) * (0.35 + Math.sin(time * 8) * 0.1);
    ctx.strokeStyle = `rgba(212,123,255,${a})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 70 + Math.sin(time * 5) * 6, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(player.tilt);
  ctx.scale(s, s);
  if (hurtT > 0 && Math.floor(hurtT * 20) % 2 === 0) ctx.globalAlpha = 0.45;
  if (loaded(fedukImg)) ctx.drawImage(fedukImg, -player.w / 2, -player.h / 2, player.w, player.h);
  else { ctx.fillStyle = "#f55"; ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h); }
  ctx.restore();
}

function drawFx() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
    pixelText(f.text, f.x, f.y, f.size, f.color, "center");
  }
  ctx.globalAlpha = 1;
}

function pixelText(text, x, y, size, color, align) {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  if (align) ctx.textAlign = align;
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillText(text, x + 1, y + 2);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawHUD(pulse) {
  for (let i = 0; i < MAX_HP / 2; i++) {
    const v = Math.max(0, Math.min(2, hp - i * 2));
    drawSprite(v === 2 ? SPR.heart : v === 1 ? SPR.heartHalf : SPR.heartEmpty, 20 + i * 22, 22, 18);
  }
  ctx.textBaseline = "middle";
  pixelText(String(score), W - 50, 23, 14, "#fff", "right");
  const y = 42;
  if (!endless) {
    const p = Math.min(1, score / WIN_SCORE);
    ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(10, y, W - 20, 8);
    ctx.fillStyle = "#1c3b8f"; ctx.fillRect(11, y + 1, W - 22, 6);
    const grad = ctx.createLinearGradient(10, 0, W - 10, 0);
    grad.addColorStop(0, "#6ad1ff"); grad.addColorStop(1, "#ffffff");
    ctx.fillStyle = grad; ctx.fillRect(11, y + 1, Math.floor((W - 22) * p), 6);
    if (pulse > 0.5) { ctx.fillStyle = `rgba(255,255,255,${(pulse - 0.5) * 0.6})`; ctx.fillRect(11, y + 1, Math.floor((W - 22) * p), 6); }
    pixelText(`${Math.min(score, WIN_SCORE)}/${WIN_SCORE}`, W / 2, y + 18, 7, "rgba(255,255,255,0.75)", "center");
  } else {
    pixelText("БЕСКОНЕЧНОСТЬ  рекорд " + Math.max(best, score), W / 2, y + 6, 7, "#ffd34d", "center");
  }
  if (combo >= 3) {
    const m = multiplier();
    pixelText(`комбо ${combo}`, W / 2, H - 22, 9, m > 1 ? "#9fe7ff" : "rgba(255,255,255,0.8)", "center");
  }
  if (magnetT > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(W / 2 - 50, H - 44, 100, 6);
    ctx.fillStyle = "#d47bff"; ctx.fillRect(W / 2 - 50, H - 44, 100 * (magnetT / 6), 6);
  }
  if (flashText) {
    const k = flashText.t;
    ctx.globalAlpha = k < 0.9 ? 1 : Math.max(0, 1 - (k - 0.9) / 0.3);
    pixelText(flashText.text, W / 2, H * 0.5, 18 + Math.max(0, 0.15 - k) * 60, "#fff", "center");
    ctx.globalAlpha = 1;
  }
  ctx.textBaseline = "alphabetic";
}

function drawHurt() {
  if (hurtT <= 0) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, "rgba(255,0,40,0)");
  g.addColorStop(1, `rgba(255,0,40,${hurtT * 0.9})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render() {
  const pulse = beatPulse();
  ctx.save();
  if (shakeT > 0) { const m = shakeT * 18; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  drawBG(pulse);
  drawTargets();
  drawItems();
  if (state !== "menu") drawPlayer(pulse);
  drawFx();
  ctx.restore();
  drawHurt();
  if (state === "play" || state === "paused") drawHUD(pulse);
}

// =====================================================================
//  ЭКРАНЫ
// =====================================================================
function showScreen(id) {
  for (const s of ["menu", "pause", "over"]) $(s).classList.toggle("show", s === id);
  canvas.classList.toggle("blurred", !!id && id !== "menu");
  $("pauseBtn").classList.toggle("show", state === "play");
}
$("menuBest").textContent = best > 0 ? "Рекорд: " + best : "";

function startGame(keepEndless = false, m = null) {
  actx.resume();
  if (!keepEndless) {
    setMode(m || mode);
    score = 0; hp = MAX_HP; combo = 0; bestCombo = 0; caught = 0; missed = 0;
    endless = false;
    items.length = 0;
    startSong();
    chartIdx = 0; chartCycle = 0; lastSpawnNote = -99;
    player.x = W / 2 - player.w / 2;
    flashText = { text: "ПОЕХАЛИ!", t: 0 };
  }
  particles.length = 0; floaters.length = 0;
  magnetT = 0; specialT = 4;
  state = "play";
  showScreen(null);
}

function endGame(win) {
  state = "over";
  const isRecord = score > best;
  if (isRecord) { best = score; store.set("best", best); }
  // убрать хлопья, которые ещё летят — песня продолжает играть фоном
  for (const f of items) if (f.chart && !f.done) {
    f.done = true;
    if (mode.autoplay && f.t > songNow()) playMelodyNote(f.idx, songStart + f.t);
  }
  if (win) {
    $("overTitle").textContent = "ПОБЕДА!";
    $("overLine").textContent = "Всюду магия и свет ✨";
    sfx.win();
    for (let i = 0; i < 80; i++) burst(Math.random() * W, H * 0.3 + Math.random() * H * 0.5, Math.random() < 0.3 ? "#ffd34d" : "#dff3ff", 1, 220);
  } else {
    $("overTitle").textContent = endless ? "ВОТ ЭТО ЗАБЕГ!" : "ИГРА ОКОНЧЕНА";
    $("overLine").textContent = "Падают хлопья, и с ними ты ❄️";
    sfx.lose();
  }
  const acc = caught + missed > 0 ? Math.round(caught / (caught + missed) * 100) : 0;
  $("overScore").textContent = `Очки: ${score}`;
  $("overStats").textContent = `Нот поймано: ${caught} (${acc}%) · Комбо: ${bestCombo}`;
  $("overRecord").innerHTML = isRecord && score > 0 ? '<span class="badge">НОВЫЙ РЕКОРД!</span>' : `<p class="gold">Рекорд: ${best}</p>`;
  $("endlessBtn").style.display = win ? "" : "none";
  $("againBtn").textContent = win ? "СНАЧАЛА" : "ЕЩЁ РАЗ";
  $("shareBtn").textContent = "ПОДЕЛИТЬСЯ";
  setTimeout(() => showScreen("over"), win ? 600 : 300);
}

function pauseGame() {
  if (state !== "play") return;
  state = "paused";
  actx.suspend();          // песня и часы игры замирают вместе
  showScreen("pause");
}
function resumeGame() {
  if (state !== "paused") return;
  actx.resume();
  state = "play";
  showScreen(null);
}

async function share() {
  const text = `Я набрал ${score} очков в игре «Хлопья летят наверх» ❄️ Попробуй побить!`;
  const url = location.href.split("#")[0];
  try {
    if (navigator.share) { await navigator.share({ title: "Хлопья летят наверх", text, url }); return; }
    await navigator.clipboard.writeText(text + " " + url);
    $("shareBtn").textContent = "СКОПИРОВАНО!";
  } catch (e) {}
}

const tap = (id, fn) => $(id).addEventListener("click", e => { e.stopPropagation(); fn(); });
tap("playBtn", () => startGame(false, MODES.piano));
tap("playOrigBtn", () => startGame(false, MODES.orig));
tap("againBtn", () => startGame());
tap("restartBtn", () => startGame());
tap("resumeBtn", resumeGame);
tap("pauseBtn", pauseGame);
tap("muteBtn1", () => { actx.resume(); toggleMute(); });
tap("muteBtn2", toggleMute);
tap("shareBtn", share);
tap("endlessBtn", () => { endless = true; startGame(true); flashText = { text: "БЕСКОНЕЧНОСТЬ!", t: 0 }; });

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (state === "play") pauseGame(); else actx.suspend(); }
  else if (state === "over") actx.resume();
});

// =====================================================================
//  УПРАВЛЕНИЕ
// =====================================================================
const keys = { left: false, right: false };
window.addEventListener("keydown", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (e.code === "Escape" || e.code === "KeyP") { state === "play" ? pauseGame() : resumeGame(); }
  if (e.code === "Space" || e.code === "Enter") {
    e.preventDefault();
    if (state === "menu" && !$("playBtn").disabled) startGame();
    else if (state === "paused") resumeGame();
    else if (state === "over" && $("over").classList.contains("show")) startGame();
  }
  pointer.active = false; pointer.x = null;
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

const pointer = { active: false, x: null };
function pMove(e) {
  if (!pointer.active && e.pointerType !== "mouse") return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - rect.left) / rect.width * W;
}
canvas.addEventListener("pointerdown", e => { pointer.active = true; pMove(e); });
window.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse" && state === "play") pointer.active = true;
  pMove(e);
});
window.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") { pointer.active = false; pointer.x = null; } });

// =====================================================================
//  ЦИКЛ
// =====================================================================
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (state !== "paused") update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (document.fonts) document.fonts.load('10px "Press Start 2P"');
</script>
</body>
</html>
