};

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingEnabled = false;
  wrap.style.setProperty("--u", (cw / W).toFixed(3));
}
window.addEventListener("resize", resize);

// маска светящихся окон из любой картинки (тёплые пиксели)
function windowMask(im) {
  const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext("2d"); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
  for (let i = 0; i < a.length; i += 4) {
    const r = a[i], gg = a[i + 1], b = a[i + 2];
    if (a[i + 3] > 0 && r > 120 && r - b > 50 && gg > 50) { a[i] = 255; a[i + 1] = Math.min(255, gg + 60); a[i + 2] = Math.min(255, b + 40); a[i + 3] = 255; }
    else a[i + 3] = 0;
  }
  g.putImageData(d, 0, 0); return c;
}
const WMASK = {};
LAYER.far.addEventListener("load", () => { try { WMASK.far = windowMask(LAYER.far); } catch (e) {} });

function drawFrame(g, name, cx, cy, h) {

  g.drawImage(atlas, sx, sy, ATLAS.cw, ATLAS.ch, cx - w / 2, cy - h / 2, w, h);
}
function drawItem(g, name, cx, cy, size) {

}

// мягкое свечение — заранее нарисованное, чтобы не тормозить на телефонах
function makeGlow(color) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, color); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
}

const HEART = [".XX.XX.", "XWXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."];
function drawHeart(cx, cy, size, fill) {   // fill: 0, 1 (половина), 2
  const p = size / 7, ox = cx - 3.5 * p, oy = cy - 3 * p;
  for (let y = 0; y < 6; y++) for (let x = 0; x < 7; x++) {
    const ch = HEART[y][x]; if (ch === ".") continue;
    const on = fill === 2 || (fill === 1 && x < 3);
    ctx.fillStyle = !on ? "#3a4664" : ch === "W" ? "#ffd0d8" : "#ff3b5c";
    ctx.fillRect(Math.floor(ox + x * p), Math.floor(oy + y * p), Math.ceil(p), Math.ceil(p));
  }
}

function startSong() {
  if (songSrc) { try { songSrc.stop(); } catch (e) {} songSrc = null; }
  songStart = actx.currentTime + 0.15;
  if (!songBuf) return;
  songSrc = actx.createBufferSource();
  songSrc.buffer = songBuf;
  songSrc.connect(musicGain);
  songSrc.start(songStart);
}
function stopSong() { if (songSrc) { try { songSrc.stop(); } catch (e) {} songSrc = null; } }
const songNow = () => actx.currentTime - songStart;
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

function bell(midi, when = 0, vol = 0.22) {
  const t = Math.max(actx.currentTime, when), f = midiHz(midi);
  const out = actx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  out.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  out.connect(sfxGain);
  [[1, 1, "sine"], [2, 0.35, "sine"], [3.01, 0.12, "triangle"]].forEach(([mul, amp, type]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f * mul;
    g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9 / mul);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 1);
  });
}
function tone(freq, dur, type = "square", vol = 0.05, slide = 0, delay = 0) {
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + dur + 0.02);
}
// протяжный звук для длинной ноты
let sustain = null;
function sustainOn(midi) {
  sustainOff();
  const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain();
  o.type = "triangle"; o.frequency.value = midiHz(midi);
  o2.type = "sine"; o2.frequency.value = midiHz(midi) * 2.003;
  g.gain.setValueAtTime(0.0001, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.07, actx.currentTime + 0.08);
  o.connect(g); o2.connect(g); g.connect(sfxGain); o.start(); o2.start();
  sustain = { o, o2, g };
}
function sustainOff() {
  if (!sustain) return;
  const { o, o2, g } = sustain, t = actx.currentTime;
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  o.stop(t + 0.2); o2.stop(t + 0.2); sustain = null;
}

let state = "menu";               // menu | play | paused | over

const items = [], particles = [], floaters = [];
const SNOW = { far: [], mid: [], near: [] };
for (let i = 0; i < 60; i++) SNOW.far.push({ x: Math.random() * W, y: Math.random() * H, s: 1, v: 8 + Math.random() * 12, ph: Math.random() * 6.28 });
for (let i = 0; i < 34; i++) SNOW.mid.push({ x: Math.random() * W, y: Math.random() * H, s: 2 + Math.floor(Math.random() * 2), v: 26 + Math.random() * 28, ph: Math.random() * 6.28 });
for (let i = 0; i < 14; i++) SNOW.near.push({ x: Math.random() * W, y: Math.random() * H, s: 7 + Math.random() * 10, v: 80 + Math.random() * 60, ph: Math.random() * 6.28 });

function noteX(midi, t) {

// =====================================================================
//  ПЛАНИРОВЩИК: заранее раскладывает ноты, длинные ноты, сосульки и бонусы

function planAhead(now) {
  const horizon = now + L.lead + 3;
  while (chartIdx < NOTE_T.length && NOTE_T[chartIdx] < horizon) {
    const i = chartIdx++;
    const t = NOTE_T[i];
    if (t < 1.0) continue;
    const gap = inChorus(t) ? L.chorusGap : L.gap;
    if (lastPlanned && t - lastPlanned.t < gap - 0.005) continue;
    let x = noteX(CHART_P[i], t);
    if (lastPlanned) {                      // не требовать невозможной скорости
      const maxDx = L.maxSpeed * (t - lastPlanned.t);
      x = clamp(x, lastPlanned.x - maxDx, lastPlanned.x + maxDx);
    }
    // длинная нота: тянется до следующей ноты, которая попадёт в игру
    let holdEnd = 0;
    if (CHART_D[i] >= 0.6) {
      let j = i + 1; while (j < NOTE_T.length && NOTE_T[j] - t < gap) j++;

      const len = Math.min(CHART_D[i] * 1.15, next - t - EIGHTH);
      if (len >= 0.45) holdEnd = t + len;
    }
    // особые предметы в паузах между нотами
    if (lastPlanned && t - lastPlanned.t >= BEAT * 1.9 && !lastPlanned.holdEnd) {
      const tm = OFF + Math.round(((lastPlanned.t + t) / 2 - OFF) / EIGHTH) * EIGHTH;
      const r = Math.random();
      if (r < L.iceChance) {
        const side = Math.random() < 0.5 ? -1 : 1;
        plan.push({ kind: "ice", t: tm, x: clamp(lastPlanned.x + side * (6 + Math.random() * 16), 30, W - 30) });
      } else if (r < L.iceChance + 0.07) {
        plan.push({ kind: "heart", t: tm, x: (lastPlanned.x + x) / 2 });
      } else if (r < L.iceChance + 0.11 && levelKey !== "easy") {
        plan.push({ kind: "star", t: tm, x: (lastPlanned.x + x) / 2 });

    plan.push({ kind: "note", t, x, i, midi: CHART_P[i], gold: isGold(i), holdEnd });
    lastPlanned = { t: holdEnd || t, x, holdEnd };

  while (plan.length && plan[0].t - now <= L.lead) {
    const p = plan.shift();
    if (p.t < now + 0.05) continue;
    items.push(Object.assign(p, { y: H + 30, rot: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 2,
      sway: Math.random() * 6.28, baseX: p.x, done: false, state: "fly" }));
  }
}

// =====================================================================
//  ЭФФЕКТЫ

function catchFx(x, y, color, perfect) {

  if (perfect) rings.push({ x, y, t: -0.06, life: 0.4, r0: 4, r1: 26, color: "#ffffff", w: 2 });
  const sp = perfect ? 210 : 150;
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3 + Math.random() * 0.2;
    shards.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: a, vr: (Math.random() - 0.5) * 10, t: 0, life: 0.45, color, len: perfect ? 8 : 6 });

}
function burst(x, y, color, n = 10, spd = 140) {

function floatText(x, y, text, color = "#fff", size = 9) { floaters.push({ x, y, text, color, size, t: 0, life: 0.8 }); }

// =====================================================================
//  ЛОГИКА

function damage(n) {

function judgeNote(f, now) {

    if (combo % 20 === 0 && hp < MAX_HP) { hp++; floatText(pcx(), CATCH_Y - 60, "+♥", "#ff6b81", 9); }
    const mult = (f.gold ? 2 : 1) * (snowfall ? 2 : 1);
    const pts = (perfect ? 300 : 100) * mult;

    if (perfect) bell(f.midi + 12, when, 0.06);
    if (f.gold) bell(f.midi + 19, when, 0.06);
    burst(f.x, CATCH_Y, f.gold ? "#ffd34d" : perfect ? "#bff4ff" : "#dff3ff", perfect ? 10 : 5, perfect ? 190 : 130);
    catchFx(f.x, CATCH_Y, f.gold ? "#ffd34d" : perfect ? "#9ff0ff" : "#dff3ff", perfect);
    judge = { text: perfect ? "ИДЕАЛЬНО" : "ХОРОШО", color: perfect ? "#7ff0ff" : "#ffffff", t: 0 };
    floatText(f.x, CATCH_Y - 20, "+" + pts, f.gold ? "#ffd34d" : "#fff", 8);
    if (combo === 25 || combo === 50 || combo === 100) flashText = { text: "КОМБО " + combo + "!", t: 0 };
    if (f.holdEnd) { holding = f; f.state = "hold"; sustainOn(f.midi); flashText = flashText || null; }

}

function judgeSpecial(f) {
  const dx = Math.abs(f.x - pcx());
  if (f.kind === "ice") {
    if (dx < 24) {
      f.state = "gone";
      burst(f.x, CATCH_Y, "#7fc4ff", 14, 180);
      floatText(f.x, CATCH_Y - 10, "АЙ!", "#ff6b81", 11);

    if (f.kind === "heart") { hp = Math.min(MAX_HP, hp + 2); burst(f.x, CATCH_Y, "#ff3b5c", 12); floatText(f.x, CATCH_Y - 10, "+♥", "#ff6b81", 11); sfx.heart(); }
    if (f.kind === "star") { magnetT = 6; burst(f.x, CATCH_Y, "#d47bff", 18, 200); flashText = { text: "МАГИЯ!", t: 0 }; sfx.star(); }

function update(dt) {
  time += dt;
  const sp = snowfall ? 2.2 : 1, wind = snowfall ? 45 : 8;
  for (const k in SNOW) for (const a of SNOW[k]) {
    a.y -= a.v * dt * sp;
    a.x += Math.sin(time * 0.7 + a.ph) * wind * dt * (k === "near" ? 1.6 : k === "mid" ? 1 : 0.4);
    if (a.y < -20) { a.y = H + 20; a.x = Math.random() * W; }
    if (a.x < -20) a.x += W + 40; else if (a.x > W + 20) a.x -= W + 40;
  }
  parX += (clamp((pcx() - W / 2) / (W / 2), -1, 1) - parX) * Math.min(1, dt * 3);
  updateFx(dt);
  aurora += ((snowfall || state === "over" && !failed ? 1 : 0) - aurora) * Math.min(1, dt * 1.5);
  if (state !== "play") return;

  // управление
  const prevX = player.x;
  if (keys.left) player.x -= player.speed * dt;
  if (keys.right) player.x += player.speed * dt;
  if (pointer.active && pointer.x !== null) player.x += (pointer.x - player.w / 2 - player.x) * Math.min(1, dt * 16);
  player.x = clamp(player.x, 0, W - player.w);

  player.tilt += (clamp(player.vx / 1800, -0.22, 0.22) - player.tilt) * Math.min(1, dt * 10);

  const now = songNow();
  // Снегопад в припеве
  const sf = inChorus(now);
  if (sf && !snowfall) { flashText = { text: "СНЕГОПАД! x2", t: 0 }; sfx.snow(); }
  snowfall = sf;

  planAhead(now);
  if (magnetT > 0) magnetT -= dt;
  if (emoT > 0) { emoT -= dt; if (emoT <= 0) emo = null; }
  const cx = pcx();

  for (let i = items.length - 1; i >= 0; i--) {
    const f = items[i];
    const left = f.t - now;
    f.y = CATCH_Y + (H + 30 - CATCH_Y) * (left / L.lead);
    f.rot += f.spin * dt;
    if (f.state === "fly") {
      if (magnetT > 0 && f.kind === "note" && left < 0.8) f.baseX += (cx - f.baseX) * Math.min(1, dt * 7);
      f.x = f.baseX + Math.sin(time * 3 + f.sway) * 5 * clamp(left / L.lead, 0, 1);

      } else if (Math.abs(f.x - cx) <= L.good + 6) {
        holdScore += dt; score += Math.round(dt * 400);
        if (Math.random() < dt * 30) burst(f.x + (Math.random() - 0.5) * 16, CATCH_Y, "#dff3ff", 1, 90);
      } else {
        f.state = "broken"; holding = null; sustainOff();
        judge = { text: "СОРВАЛОСЬ", color: "#ffb0c0", t: 0 };
      }
    }
    const tailY = f.holdEnd ? CATCH_Y + (H + 30 - CATCH_Y) * ((f.holdEnd - now) / L.lead) : f.y;
    if (f.state !== "hold" && tailY < -40 && f.y < -40) items.splice(i, 1);
    else if (f.state === "gone" && !f.holdEnd) items.splice(i, 1);

function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 60 * dt; p.vx *= 0.98;
    if (p.t > p.life) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.t += dt; f.y -= 40 * dt; if (f.t > f.life) floaters.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > rings[i].life) rings.splice(i, 1); }
  for (let i = shards.length - 1; i >= 0; i--) {
    const q = shards[i]; q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.93; q.vy *= 0.93; q.rot += q.vr * dt;
    if (q.t > q.life) shards.splice(i, 1);

  if (judge) { judge.t += dt; if (judge.t > 0.5) judge = null; }
  shakeT = Math.max(0, shakeT - dt); hurtT = Math.max(0, hurtT - dt); catchPulse = Math.max(0, catchPulse - dt * 6);

// =====================================================================
//  ОТРИСОВКА
// =====================================================================
function beats() { return songSrc || state !== "menu" ? (songNow() - OFF) / BEAT : time * 2.3; }
function beatPulse() {
  if (state === "menu") return 0;
  const b = beats(); if (b < 0) return 0;
  return Math.exp(-(b - Math.floor(b)) * 6);
}

// северное сияние: рисуем в маленький холст и растягиваем — получается пиксельно
const auroraCv = document.createElement("canvas"); auroraCv.width = 90; auroraCv.height = 100;
const actxA = auroraCv.getContext("2d");
const AUR_BANDS = [["61,255,168", 30, 0], ["73,215,255", 44, 2.1], ["183,123,255", 22, 4.2]].map(([col, base, ph]) => {
  const c = document.createElement("canvas"); c.width = 1; c.height = 26;
  const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 26);
  gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(1, `rgba(${col},0.55)`);
  g.fillStyle = gr; g.fillRect(0, 0, 1, 26);
  return { strip: c, base, ph };
});
function drawAurora(g, w, h, level, t) {
  if (level < 0.02) return;
  actxA.clearRect(0, 0, 90, 100);
  for (const { strip, base, ph } of AUR_BANDS) {
    for (let x = 0; x < 90; x++) {
      const y = base + Math.sin(x * 0.11 + t * 0.7 + ph) * 8 + Math.sin(x * 0.29 - t * 1.1 + ph) * 3;
      const len = Math.round(18 + Math.sin(x * 0.2 + t + ph) * 8);
      actxA.drawImage(strip, x, Math.floor(y - len), 1, len);
    }
  }
  g.save(); g.globalAlpha = level * 0.5; g.globalCompositeOperation = "lighter";
  g.imageSmoothingEnabled = false;
  g.drawImage(auroraCv, 0, -h * 0.04, w, h * 0.5);
  g.restore();
}

function drawLayer(im, depth, bottom) {
  const k = 1.08, w = W * k, h = H * k;
  ctx.drawImage(im, (W - w) / 2 - parX * depth, bottom ? H - h : (H - h) / 2, w, h);
}
function drawWindows(mask, depth, bottom, pulse) {
  if (!mask) return;
  const k = 1.08, w = W * k, h = H * k, x0 = (W - w) / 2 - parX * depth, y0 = bottom ? H - h : (H - h) / 2;
  ctx.save(); ctx.globalCompositeOperation = "lighter";

      ctx.globalAlpha = 0.15 + 0.6 * Math.max(0, Math.cos((b * 0.5 - s / strips) * Math.PI * 2));

  // небо

    gr.addColorStop(0.45, `rgba(255,120,160,${0.3 * dawn})`);

// крупные размытые хлопья прямо перед камерой
function drawNearSnow() {

  ctx.restore();
}

function drawRingsShards() {
  for (const r of rings) {
    if (r.t < 0) continue;
    const k = r.t / r.life, rad = r.r0 + (r.r1 - r.r0) * (1 - (1 - k) * (1 - k));
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = r.w;
    // пиксельное кольцо: восьмиугольник
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; const px = Math.round(r.x + Math.cos(a) * rad), py = Math.round(r.y + Math.sin(a) * rad); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke();

    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.color;

function drawTargets(now) {
  if (state !== "play") return;
  for (const f of items) {
    if (f.state !== "fly" || f.kind !== "note") continue;
    const left = f.t - now;
    if (left > 0.9 || left < 0) continue;
    const k = left / 0.9, r = 7 + k * 22;
    ctx.strokeStyle = f.gold ? `rgba(255,211,77,${0.75 - k * 0.6})` : `rgba(200,230,255,${0.6 - k * 0.5})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(Math.floor(f.x - r), Math.floor(CATCH_Y - r), Math.floor(r * 2), Math.floor(r * 2));

    const tailY = CATCH_Y + (H + 30 - CATCH_Y) * ((f.holdEnd - now) / L.lead);
    if (tailY <= headY || f.state === "gone") continue;

    if (f.kind === "note") {
      const glow = f.gold ? GLOW.gold : (combo >= 15 || snowfall) ? GLOW.cyan : null;
      if (glow && !faded) ctx.drawImage(glow, f.x - 24, f.y - 24, 48, 48);
      ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      drawItem(ctx, f.gold ? "gold" : snowfall ? "perfect" : "flake", 0, 0, f.gold ? 30 : 26);
    } else {
      const s = 1 + Math.sin(time * 6 + f.sway) * 0.08;
      const glow = f.kind === "ice" ? GLOW.red : f.kind === "heart" ? GLOW.pink : GLOW.purple;
      if (!faded) ctx.drawImage(glow, f.x - 24, f.y - 24, 48, 48);
      ctx.translate(f.x, f.y); ctx.scale(s, s);
      drawItem(ctx, f.kind, 0, 0, f.kind === "ice" ? 34 : 28);
    }
    ctx.restore();
  }
}

function fedukFrame() {
  if (state === "over" && !failed) return skinId === "base" ? "victory" : skin().frames[0];
  if (emo) return emo;
  const fr = skin().frames;
  if (fr.length === 1) return fr[0];
  const idx = Math.floor(beats() * 4) % 4;
  return fr[(idx + 4) % 4];
}

function drawPlayer(pulse) {
  const b = beats();
  const single = skin().frames.length === 1;
  const bobY = Math.sin(b * Math.PI * (single ? 1 : 0.5)) * (single ? 4 : 2);
  const cx = pcx() + Math.sin(time * 1.7) * 1.2, cy = player.y + player.h / 2 + bobY;
  const s = 1 + catchPulse * 0.08 + pulse * 0.015;
  // ореол при комбо 30+ и в Снегопаде
  if (combo >= 30 || snowfall) {
    const k = combo >= 30 ? 1 : 0.6, r = 70 + Math.sin(time * 4) * 6;
    ctx.save(); ctx.globalAlpha = 0.45 * k + pulse * 0.2;
    ctx.drawImage(snowfall ? GLOW.gold : GLOW.cyan, cx - r, cy - r, r * 2, r * 2); ctx.restore();
  }
  if (magnetT > 0) {
    const a = Math.min(1, magnetT) * (0.35 + Math.sin(time * 8) * 0.1);
    ctx.strokeStyle = `rgba(212,123,255,${a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 72 + Math.sin(time * 5) * 6, 0, Math.PI * 2); ctx.stroke();
  }
  const frame = fedukFrame();
  // шлейф при быстром движении
  if (time - lastTrail > 0.035) { trail.push({ x: cx, y: cy, tilt: player.tilt, frame, v: Math.abs(player.vx) }); lastTrail = time; if (trail.length > 6) trail.shift(); }
  if (state === "play") {
    for (let i = 0; i < trail.length - 1; i++) {
      const tr = trail[i];
      if (tr.v < 260 || Math.abs(tr.x - cx) < 6) continue;
      ctx.save(); ctx.globalAlpha = 0.07 + i * 0.035;
      ctx.translate(tr.x, tr.y); ctx.rotate(tr.tilt); drawFrame(ctx, tr.frame, 0, 0, 150); ctx.restore();
    }
    if (Math.abs(player.vx) > 340 && Math.random() < 0.6) {
      const dir = Math.sign(player.vx);
      particles.push({ x: cx - dir * 18, y: cy + 30 + Math.random() * 30, vx: -dir * (40 + Math.random() * 60), vy: 20 + Math.random() * 30, life: 0.4 + Math.random() * 0.3, t: 0, c: "rgba(230,242,255,0.9)", s: 2 });
    }
  }
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(player.tilt); ctx.scale(s, s);
  if (hurtT > 0 && Math.floor(hurtT * 20) % 2 === 0) ctx.globalAlpha = 0.45;
  drawFrame(ctx, frame, 0, 0, 150);
  ctx.restore();
}

function drawFx() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.c; ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
    pixelText(f.text, f.x, f.y, f.size, f.color, "center");
  }
  ctx.globalAlpha = 1;
}

function pixelText(text, x, y, size, color, align, g = ctx) {
  g.font = `${size}px "Press Start 2P", monospace`;
  if (align) g.textAlign = align;
  g.fillStyle = "rgba(0,0,0,0.7)"; g.fillText(text, x + Math.max(1, size / 10), y + Math.max(2, size / 7));
  g.fillStyle = color; g.fillText(text, x, y);
}

function accuracy() {
  const n = nPerfect + nGood + nMiss;
  return n ? (nPerfect + nGood * 0.5) / n * 100 : 100;
}
function gradeOf(acc) { return acc >= 95 ? "S" : acc >= 88 ? "A" : acc >= 75 ? "B" : acc >= 60 ? "C" : "D"; }
const GRADE_COLOR = { S: "#ffd34d", A: "#7ff0ff", B: "#8dff9a", C: "#d0d6e6", D: "#ff8fa3" };

function drawHUD(pulse, now) {
  for (let i = 0; i < MAX_HP / 2; i++) drawHeart(18 + i * 21, 20, 17, clamp(hp - i * 2, 0, 2));
  ctx.textBaseline = "middle";
  pixelText(String(score), W - 46, 21, 11, "#fff", "right");
  // прогресс песни с отметками припевов
  const y = 38, x0 = 10, w = W - 20;
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(x0, y, w, 8);
  ctx.fillStyle = "#1c3b8f"; ctx.fillRect(x0 + 1, y + 1, w - 2, 6);
  for (const [a, b] of CHORUS) { ctx.fillStyle = "rgba(255,211,77,0.35)"; ctx.fillRect(x0 + 1 + (w - 2) * a / SONG_END, y + 1, (w - 2) * (b - a) / SONG_END, 6); }
  const p = clamp(now / SONG_END, 0, 1);
  const gr = ctx.createLinearGradient(x0, 0, x0 + w, 0); gr.addColorStop(0, "#6ad1ff"); gr.addColorStop(1, "#ffffff");
  ctx.fillStyle = gr; ctx.fillRect(x0 + 1, y + 1, Math.floor((w - 2) * p), 6);
  if (pulse > 0.5) { ctx.fillStyle = `rgba(255,255,255,${(pulse - 0.5) * 0.6})`; ctx.fillRect(x0 + 1, y + 1, Math.floor((w - 2) * p), 6); }
  const acc = accuracy();
  pixelText(`${L.name}  ${acc.toFixed(1)}%  ${gradeOf(acc)}`, W / 2, y + 17, 6, "rgba(255,255,255,0.75)", "center");
  if (combo >= 3) pixelText(`комбо ${combo}`, W / 2, H - 22, combo >= 30 ? 11 : 9, combo >= 30 ? "#ffd34d" : combo >= 15 ? "#9fe7ff" : "rgba(255,255,255,0.8)", "center");
  if (snowfall) pixelText("СНЕГОПАД x2", W / 2, H - 42, 7, "#ffd34d", "center");
  if (magnetT > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(W / 2 - 50, H - 58, 100, 5);
    ctx.fillStyle = "#d47bff"; ctx.fillRect(W / 2 - 50, H - 58, 100 * (magnetT / 6), 5);
  }
  if (judge) {
    const k = judge.t, sc = 1 + Math.max(0, 0.12 - k) * 3;
    ctx.globalAlpha = k < 0.35 ? 1 : Math.max(0, 1 - (k - 0.35) / 0.15);
    pixelText(judge.text, pcx(), player.y + player.h + 26, Math.round(9 * sc), judge.color, "center");
    ctx.globalAlpha = 1;
  }
  if (flashText) {
    const k = flashText.t;
    ctx.globalAlpha = k < 1 ? 1 : Math.max(0, 1 - (k - 1) / 0.3);
    pixelText(flashText.text, W / 2, H * 0.52, Math.round(15 + Math.max(0, 0.15 - k) * 50), "#fff", "center");
    ctx.globalAlpha = 1;
  }
  ctx.textBaseline = "alphabetic";
}

function drawHurt() {
  if (hurtT <= 0) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, "rgba(255,0,40,0)"); g.addColorStop(1, `rgba(255,0,40,${hurtT * 0.9})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render() {
  const pulse = beatPulse(), now = state === "menu" ? 0 : songNow();
  ctx.save();
  if (shakeT > 0) { const m = shakeT * 18; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  drawBG(pulse, now);
  drawTargets(now);
  drawItems(now);
  if (state !== "menu") drawPlayer(pulse);
  drawRingsShards();
  drawFx();
  drawNearSnow();
  ctx.restore();
  drawHurt();
  if (state === "play" || state === "paused") drawHUD(pulse, now);
}

// =====================================================================
//  ЭКРАНЫ
// =====================================================================
function showScreen(id) {
  for (const s of ["menu", "skinsScr", "pause", "over", "cardScr"]) $(s).classList.toggle("show", s === id);
  canvas.classList.toggle("blurred", id === "pause" || id === "over" || id === "cardScr");
  $("pauseBtn").classList.toggle("show", state === "play");
}

function buildLegend() {
  const icon = fn => { const c = document.createElement("canvas"); c.width = c.height = 32; const g = c.getContext("2d"); g.imageSmoothingEnabled = false; fn(g); return c.toDataURL(); };
  const rows = [
    [icon(g => drawItem(g, "flake", 16, 16, 30)), "нота"],
    [icon(g => drawItem(g, "gold", 16, 16, 30)), "x2 очки"],
    [icon(g => { if (loaded(ribbonImg)) g.drawImage(ribbonImg, 10, 0, 12, 32); }), "держи"],
    [icon(g => drawItem(g, "heart", 16, 16, 30)), "жизнь"],
    [icon(g => drawItem(g, "star", 16, 16, 30)), "магнит"],
    [icon(g => drawItem(g, "ice", 16, 16, 30)), "не лови!"]
  ];
  $("legend").innerHTML = rows.map(([s, t]) => `<img src="${s}" alt=""><span>${t}</span>`).join("");
}
let legendReady = 0;
[itemsImg, ribbonImg].forEach(i => i.addEventListener("load", () => { if (++legendReady === 2) buildLegend(); }));
if (loaded(itemsImg) && loaded(ribbonImg)) buildLegend();

function buildLevels() {
  $("levels").innerHTML = Object.entries(LEVELS).map(([k, l]) => {
    const b = store.get("best_" + k, null);
    return `<button class="lvl ${k === levelKey ? "on" : ""}" data-l="${k}">${l.name}<span>${b ? b.grade + " · " + b.score : "—"}</span></button>`;
  }).join("");
  $("levels").querySelectorAll("button").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation(); levelKey = btn.dataset.l; L = LEVELS[levelKey]; store.set("level", levelKey); buildLevels();
  }));
}
buildLevels();

function buildSkins() {
  $("skinGrid").innerHTML = "";
  for (const s of SKINS) {
    const el = document.createElement("button");
    const open = unlocked.has(s.id);
    el.className = "skin" + (s.id === skinId ? " on" : "") + (open ? "" : " locked");
    const cv = document.createElement("canvas"); cv.width = 211; cv.height = 297;
    const g = cv.getContext("2d"); g.imageSmoothingEnabled = false; drawFrame(g, s.frames[0], 105, 148, 297);
    el.appendChild(cv);
    el.insertAdjacentHTML("beforeend", `<div>${s.name}</div><div class="cond">${s.id === skinId ? "ВЫБРАН" : "выбрать"}</div>`);
    el.addEventListener("click", e => { e.stopPropagation(); if (!open) return; skinId = s.id; store.set("skin", skinId); buildSkins(); });
    $("skinGrid").appendChild(el);
  }
}

function startGame() {
  actx.resume();
  score = 0; hp = MAX_HP; combo = 0; bestCombo = 0; nPerfect = 0; nGood = 0; nMiss = 0; holdScore = 0;
  chartIdx = 0; plan = []; lastPlanned = null; failed = false;
  items.length = 0; particles.length = 0; floaters.length = 0; rings.length = 0; shards.length = 0; trail.length = 0;
  magnetT = 0; emo = null; holding = null; snowfall = false; judge = null; sustainOff();
  player.x = W / 2 - player.w / 2;
  startSong();
  state = "play";
  flashText = { text: "ПОЕХАЛИ!", t: 0 };
  showScreen(null);
}

let result = null;
function finish(win) {
  if (state !== "play") return;
  state = "over"; failed = !win; holding = null; sustainOff();
  const acc = accuracy(), grade = gradeOf(acc), now = songNow();
  result = { win, acc, grade, score, bestCombo, nPerfect, nGood, nMiss, level: L.name, progress: clamp(now / SONG_END, 0, 1) };
  const badges = [];
  if (win) {
    const key = "best_" + levelKey, prev = store.get(key, null);
    if (!prev || score > prev.score) { store.set(key, { score, grade }); if (prev) badges.push("НОВЫЙ РЕКОРД!"); }
    sfx.win();
    for (let i = 0; i < 80; i++) burst(Math.random() * W, H * 0.3 + Math.random() * H * 0.5, Math.random() < 0.3 ? "#ffd34d" : "#dff3ff", 1, 220);
  } else {
    sfx.lose();
    stopSong();
  }
  $("overTitle").textContent = win ? "ПЕСНЯ ПРОЙДЕНА!" : "ХЛОПЬЯ УЛЕТЕЛИ…";
  const gEl = $("overGrade");
  gEl.textContent = win ? grade : Math.round(result.progress * 100) + "%";
  gEl.style.color = win ? GRADE_COLOR[grade] : "#ff8fa3";
  gEl.style.fontSize = win ? "" : "calc(var(--u) * 34px)";
  $("overLine").textContent = win ? "Всюду магия и свет ✨" : "Падают хлопья, и с ними ты ❄️";
  $("overStats").innerHTML = `
    <div>ОЧКИ<b>${score}</b></div><div>ТОЧНОСТЬ<b>${acc.toFixed(1)}%</b></div>
    <div>ИДЕАЛЬНО / ХОРОШО<b>${nPerfect} / ${nGood}</b></div><div>МИМО · КОМБО<b>${nMiss} · ${bestCombo}</b></div>`;
  $("overBadges").innerHTML = badges.map(b => `<span class="badge">${b}</span>`).join("");
  $("againBtn").textContent = win ? "ЕЩЁ РАЗ" : "ПОПРОБОВАТЬ СНОВА";
  buildLevels();
  setTimeout(() => showScreen("over"), win ? 900 : 400);
}

function pauseGame() { if (state !== "play") return; state = "paused"; actx.suspend(); showScreen("pause"); }
function resumeGame() { if (state !== "paused") return; actx.resume(); state = "play"; showScreen(null); }
function toMenu() { stopSong(); sustainOff(); actx.resume(); state = "menu"; items.length = 0; showScreen("menu"); }

// =====================================================================
//  КАРТОЧКА ДЛЯ СТОРИС (1080×1920)
// =====================================================================
let cardBlob = null;
async function makeCard() {
  try { await document.fonts.load('40px "Press Start 2P"'); } catch (e) {}
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1920;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  if (loaded(bgImg)) g.drawImage(bgImg, 0, 0, 1080, 1920);
  const dark = g.createLinearGradient(0, 0, 0, 1920);
  dark.addColorStop(0, "rgba(5,10,30,0.35)"); dark.addColorStop(0.55, "rgba(5,10,30,0.55)"); dark.addColorStop(1, "rgba(5,10,30,0.2)");
  g.fillStyle = dark; g.fillRect(0, 0, 1080, 1920);
  drawAurora(g, 1080, 1920, 1, 2.0);
  if (loaded(winImg)) { g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.35; g.drawImage(winImg, 0, 0, 1080, 1920); g.restore(); }
  for (let i = 0; i < 70; i++) { const x = Math.random() * 1080, y = Math.random() * 1920, s = 3 + Math.random() * 6; g.fillStyle = "rgba(230,240,255,0.7)"; g.fillRect(x, y, s, s); }
  g.textBaseline = "middle";
  const title = (t, y, size, col) => { g.font = `${size}px "Press Start 2P", monospace`; g.textAlign = "center"; g.fillStyle = "#2a5cff"; g.fillText(t, 540, y + size * 0.18); g.fillStyle = col; g.fillText(t, 540, y); };
  title("ХЛОПЬЯ", 170, 72, "#eaf6ff"); title("ЛЕТЯТ НАВЕРХ", 270, 64, "#eaf6ff");
  // Федук
  g.save(); g.globalAlpha = 0.9; g.drawImage(GLOW.white, 540 - 330, 760 - 330, 660, 660); g.restore();
  drawFrame(g, result.win ? (skinId === "base" ? "victory" : skin().frames[0]) : (skinId === "base" ? "hurt" : skin().frames[0]), 540, 760, 640);
  // оценка
  const gr = result.win ? result.grade : Math.round(result.progress * 100) + "%";
  const col = result.win ? GRADE_COLOR[result.grade] : "#ff8fa3";
  g.save(); g.globalAlpha = 0.8; g.drawImage(result.win && result.grade === "S" ? GLOW.gold : GLOW.cyan, 540 - 220, 1230 - 220, 440, 440); g.restore();
  g.font = `${result.win ? 230 : 120}px "Press Start 2P", monospace`; g.textAlign = "center";
  g.fillStyle = "rgba(0,0,0,0.55)"; g.fillText(gr, 552, 1252); g.fillStyle = col; g.fillText(gr, 540, 1235);
  title(result.win ? "ПЕСНЯ ПРОЙДЕНА" : "ПОЧТИ ДОЛЕТЕЛ", 1430, 40, "#ffffff");
  g.font = '34px "Press Start 2P", monospace'; g.fillStyle = "#cfe0ff";
  g.fillText(`${result.level} · ${result.score} ОЧКОВ`, 540, 1520);
  g.fillText(`ТОЧНОСТЬ ${result.acc.toFixed(1)}% · КОМБО ${result.bestCombo}`, 540, 1585);
  g.font = '30px "Press Start 2P", monospace'; g.fillStyle = "#ffd34d"; g.fillText("ПОБЕЙ МОЙ РЕКОРД ❄", 540, 1720);
  g.font = '22px "Press Start 2P", monospace'; g.fillStyle = "#ffffff";
  g.fillText(location.host + location.pathname.replace(/index\.html$/, ""), 540, 1790);
  return new Promise(res => c.toBlob(b => res(b), "image/png"));
}
async function openCard() {
  $("cardBtn").textContent = "РИСУЮ…";
  cardBlob = await makeCard();
  $("cardImg").src = URL.createObjectURL(cardBlob);
  $("cardBtn").textContent = "КАРТОЧКА ДЛЯ СТОРИС";
  showScreen("cardScr");
}
async function shareCard() {
  if (!cardBlob) return;
  const file = new File([cardBlob], "hlopya-letyat-naverh.png", { type: "image/png" });
  const text = `Прошёл «Хлопья летят наверх» на ${result.win ? result.grade : Math.round(result.progress * 100) + "%"} ❄️ Побьёшь?`;
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text, url: location.href.split("#")[0] }); return; }
  } catch (e) { return; }
  saveCard();
}
function saveCard() {
  if (!cardBlob) return;
  const a = document.createElement("a"); a.href = URL.createObjectURL(cardBlob); a.download = "hlopya-letyat-naverh.png";
  document.body.appendChild(a); a.click(); a.remove();
}

// кнопки
const tap = (id, fn) => $(id).addEventListener("click", e => { e.stopPropagation(); fn(); });
tap("playBtn", startGame);
tap("againBtn", startGame);
tap("restartBtn", startGame);
tap("resumeBtn", resumeGame);
tap("pauseBtn", pauseGame);
tap("menuBtn1", toMenu);
tap("menuBtn2", toMenu);
tap("muteBtn1", () => { actx.resume(); toggleMute(); });
tap("muteBtn2", toggleMute);
tap("skinsBtn", () => { buildSkins(); showScreen("skinsScr"); });
tap("skinsBack", () => showScreen("menu"));
tap("cardBtn", openCard);
tap("shareCardBtn", shareCard);
tap("saveCardBtn", saveCard);
tap("cardBack", () => showScreen("over"));
atlas.addEventListener("load", () => { if ($("skinsScr").classList.contains("show")) buildSkins(); });

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (state === "play") pauseGame(); else actx.suspend(); }
  else if (state === "over" || state === "menu") actx.resume();
});

// =====================================================================
//  УПРАВЛЕНИЕ
// =====================================================================
const keys = { left: false, right: false };
const pointer = { active: false, x: null };
window.addEventListener("keydown", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (e.code === "Escape" || e.code === "KeyP") { state === "play" ? pauseGame() : resumeGame(); }
  if (e.code === "Space" || e.code === "Enter") {
    e.preventDefault();
    if (state === "menu" && $("menu").classList.contains("show") && !$("playBtn").disabled) startGame();
    else if (state === "paused") resumeGame();
    else if (state === "over" && $("over").classList.contains("show")) startGame();
  }
  pointer.active = false; pointer.x = null;
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});
function pMove(e) {
  if (!pointer.active && e.pointerType !== "mouse") return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - rect.left) / rect.width * W;
}
canvas.addEventListener("pointerdown", e => { pointer.active = true; pMove(e); });
window.addEventListener("pointermove", e => { if (e.pointerType === "mouse" && state === "play") pointer.active = true; pMove(e); });
window.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") { pointer.active = false; pointer.x = null; } });

// =====================================================================
//  ЦИКЛ
// =====================================================================
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (state !== "paused") update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (document.fonts) document.fonts.load('10px "Press Start 2P"');
</script>
